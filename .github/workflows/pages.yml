name: Publish FILMLABB (optional GitHub Pages)
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Check that this is still current main
        id: current
        run: |
          if [ "$(git rev-parse HEAD)" = "$(git ls-remote origin refs/heads/main | cut -f1)" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "A newer main exists; skip this obsolete build."
          fi
      - if: steps.current.outputs.publish == 'true'
        uses: actions/configure-pages@v5
      - if: steps.current.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/
      - if: steps.current.outputs.publish == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
