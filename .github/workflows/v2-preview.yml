# Install this workflow in AxelTidehorn/negative-studio-v2-preview on main.
# It is intentionally unable to deploy from the production repository.
name: Publish isolated FILMLABB v2 preview
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/v2-preview.yml]
  schedule:
    - cron: '*/5 * * * *'
permissions: {}
concurrency:
  group: filmlabb-v2-preview
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'AxelTidehorn/negative-studio-v2-preview'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}v2.html
    steps:
      - name: Check out the v2 development branch
        uses: actions/checkout@v4
        with:
          repository: AxelTidehorn/negative-studio
          ref: feat/filmlabb-v2-prototype
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Detect a new source commit
        id: source
        env:
          PREVIEW_FORCE: ${{ github.event_name != 'schedule' }}
        run: node tools/check-v2-preview.mjs
      - if: steps.source.outputs.publish == 'true'
        run: npm ci --no-audit --no-fund
      - if: steps.source.outputs.publish == 'true'
        run: npm run build
      - if: steps.source.outputs.publish == 'true'
        name: Verify conversion and prepare cache-isolated site
        run: |
          node tests/conversion-v2.mjs
          node tools/prepare-v2-preview.mjs
      - if: steps.source.outputs.publish == 'true'
        uses: actions/configure-pages@v5
      - if: steps.source.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/
      - if: steps.source.outputs.publish == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
      - if: steps.source.outputs.publish == 'true'
        name: Verify the deployed commit and resources over HTTPS
        env:
          FILMLABB_PREVIEW_URL: ${{ steps.deployment.outputs.page_url }}
        run: node tools/verify-v2-preview.mjs
