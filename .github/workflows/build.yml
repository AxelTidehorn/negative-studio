name: Build Negative Studio Beta 3
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: node tests/raw-fixture.mjs
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: Negative-Studio-Beta-3-WASM
          path: site/
