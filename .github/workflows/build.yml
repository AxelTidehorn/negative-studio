name: Build FILMLABB
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Prepare browser
        run: |
          filmlabb_chrome_bin="$(command -v google-chrome || command -v chromium || true)"
          if [ -n "$filmlabb_chrome_bin" ]; then
            printf 'FILMLABB_CHROMIUM_BIN=%s\n' "$filmlabb_chrome_bin" >> "$GITHUB_ENV"
            "$filmlabb_chrome_bin" --version
          else
            npx playwright install --with-deps chromium
          fi
      - run: npm run test:full
      - uses: actions/upload-artifact@v4
        with:
          name: FILMLABB-WASM
          path: site/
